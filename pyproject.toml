[project]
name = "hand4whole-plus-plus"
version = "0.1.0"
description = "Hand4Whole++ runtime environment"
readme = "README.md"
requires-python = "==3.10.16"
dependencies = [
  "einops==0.8.1",
  "kornia==0.8.0",
  "matplotlib==3.10.1",
  "mmcv==2.1.0",
  "mmdet==3.3.0",
  "mmengine==0.10.7",
  "mmpose==1.3.2",
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "onnxruntime-gpu==1.23.0",
  "pycocotools==2.0.8",
  "pyrender==0.1.45",
  "pytorch-lightning==2.5.1",
  "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git@33824be3cbc87a7dd1db0f6a9a9de9ac81b2d0ba",
  "setuptools==60.2.0",
  "smplx==0.1.28",
  "timm==1.0.15",
  "torch==2.6.0",
  "torchgeometry==0.1.2",
  "torchvision==0.21.0",
  "tqdm==4.67.1",
  "wheel==0.45.1",
  "yacs==0.1.8",
]

[tool.uv]
package = false
no-build-isolation-package = ["mmcv"]

[tool.uv.extra-build-dependencies]
chumpy = ["pip==25.0.1"]
pytorch3d = ["torch==2.6.0"]
